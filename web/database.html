<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>綠島海龜模型資料庫｜海龜個體辨識系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/ocean.css">
</head>
<body>
  <main class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div style="font-size:24px;font-weight:900;color:var(--navy)">綠島海龜模型資料庫</div>
      <input class="input" id="search" placeholder="搜尋編號／暱稱" style="width:240px">
    </div>
    <div class="db-layout">
      <div class="paper db-list" id="indList"><div class="empty">載入中…</div></div>
      <div class="db-main" id="main"><div class="paper empty">請從左側選擇個體</div></div>
    </div>
    <div class="paper" style="padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div style="font-size:12px;color:var(--muted);line-height:1.6">依「納入比對索引」勾選結果重建比對索引；被取消勾選或刪除的照片會一併從比對資料中移除。<br><span id="syncInfo">上次更新：-</span></div>
      <button class="btn btn-orange" id="syncBtn">更新比對資料</button>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/database.js"></script>
</body>
</html>
